# Reusable configuration templates
# Note: These must be lists (with the - prefix) to work correctly with YAML anchors
_config_templates:
  anthropic_thinking_1024: &anthropic_thinking_1024
  - config_name: "thinking_1024"
    api_args:
      thinking:
        type: enabled
        budget_tokens: 1024

  openai_reasoning_medium: &openai_reasoning_medium
  - config_name: "reasoning_medium"
    api_args:
      reasoning:
        effort: medium

models:
  # ============================================================================
  # Anthropic Models
  # ============================================================================

  - name: Claude Sonnet 4
    model_id: sonnet_4
    provider: Anthropic
    release_date: 2025-05-22
    input_price: 3
    output_price: 15
    api_model_id: anthropic/claude-sonnet-4-20250514
    default_params_description: "No extended thinking"
    alternative_configs: *anthropic_thinking_1024

  - name: Claude Sonnet 4.5
