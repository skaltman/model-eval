# Reusable configuration templates
_config_templates:
  anthropic_thinking: &anthropic_thinking
    thinking:
      type: enabled
      budget_tokens: 2000

  openai_reasoning_medium: &openai_reasoning_medium
    reasoning:
      effort: medium

  gemini_3_thinking_high: &gemini_3_thinking_high
    thinkingConfig:
      thinkingLevel: HIGH

  gemini_2_5_thinking_2k: &gemini_2_5_thinking_2k
    thinkingConfig:
      thinkingBudget: 2000

models:
  # ============================================================================
  # Anthropic Models
  # ============================================================================

  - name: Claude Sonnet 4
    model_id: sonnet_4
    provider: Anthropic
    release_date: 2025-05-22
    input_price: 3
    output_price: 15
    api_model_id: anthropic/claude-sonnet-4-20250514
    thinking_config:
      <<: *anthropic_thinking

  - name: Claude Sonnet 4.5
    model_id: sonnet_4_5
    provider: Anthropic
    release_date: 2025-09-29
    input_price: 3
    output_price: 15
    api_model_id: anthropic/claude-sonnet-4-5-20250929
    thinking_config:
      <<: *anthropic_thinking

  - name: Claude Opus 4.1
    model_id: opus_4_1
    provider: Anthropic
    release_date: 2025-08-05
    input_price: 15
    output_price: 75
    api_model_id: anthropic/claude-opus-4-1-20250805
    thinking_config:
      <<: *anthropic_thinking

  - name: Claude Opus 4.5
    model_id: opus_4_5
    provider: Anthropic
